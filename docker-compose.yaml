services:
  postgres:
    image: postgres:18
    container_name: file-api-postgres
    environment:
      POSTGRES_DB: file_api
      POSTGRES_USER: file_api
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U file_api -d file_api"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: